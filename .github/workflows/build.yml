name: Build lunyso-desktop

on:
  push:
    branches: [main, lunyso-5.3.4]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options: [all, linux, windows]

env:
  BUILD_TYPE: RelWithDebInfo
  QT_VERSION: "5.15.2"
  MAKEFILE_JOBS: 4

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (MSVC 2022 + Qt 5.15.2)
    runs-on: [self-hosted, Windows, x64]
    if: >-
      github.event.inputs.build_target == 'all' ||
      github.event.inputs.build_target == 'windows' ||
      github.event_name != 'workflow_dispatch'
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Init submodules (skip ispell)
        shell: cmd
        run: |
          git submodule update --init external/qtkeychain
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          :retry
          if exist linphone-sdk rmdir /s /q linphone-sdk
          git clone --depth 1 https://github.com/Eclipse94w/linphone-sdk-mirror.git linphone-sdk
          if errorlevel 1 (
            echo Clone failed, retrying in 15s...
            timeout /t 15 /nobreak
            goto retry
          )

      - name: Install tools via Chocolatey
        shell: powershell
        run: |
          choco install -y --no-progress python cmake ninja nsis 7zip git-lfs

      - name: Install aqtinstall
        shell: cmd
        run: python -m pip install aqtinstall

      - name: Install Qt 5.15.2
        shell: cmd
        run: |
          aqt install-qt windows desktop %QT_VERSION% win64_msvc2019_64 -O C:\Qt

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Patch Doxyfile.in (remove tags obsolete in doxygen >= 1.9.1)
        shell: powershell
        run: |
          $files = @(
            "linphone-sdk\liblinphone\coreapi\help\doc\doxygen\Doxyfile.in",
            "linphone-sdk\liblinphone\wrappers\cpp\Doxyfile.in"
          )
          $obsolete = @(
            'COLS_IN_ALPHA_INDEX\s*=\s*\d+',
            'CLASS_DIAGRAMS\s*=\s*\w+',
            'DOT_FONTNAME\s*=\s*.*',
            'DOT_FONTSIZE\s*=\s*\d+',
            'DOT_FONTPATH\s*=.*',
            'TEMPLATE_RELATIONS\s*=\s*\w+',
            'DOT_TRANSPARENT\s*=\s*\w+',
            'GENERATE_LEGEND\s*=\s*\w+'
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              $content = Get-Content $f -Raw
              foreach ($pat in $obsolete) {
                $content = $content -replace "(?m)^$pat\r?$", ''
              }
              Set-Content $f $content -NoNewline
            }
          }

      - name: Configure CMake
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files\Git\usr\bin
          if exist build-windows rmdir /s /q build-windows
          mkdir build-windows
          cd build-windows
          cmake .. -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_PREFIX_PATH=C:/Qt/%QT_VERSION%/msvc2019_64 ^
            -DLINPHONESDK_PLATFORM=Desktop ^
            -DENABLE_APP_PACKAGING=ON ^
            -DENABLE_UNIT_TESTS=OFF ^
            -DENABLE_G729=OFF ^
            -DENABLE_PQCRYPTO=OFF ^
            -DENABLE_GPL_THIRD_PARTIES=ON ^
            -DENABLE_CSHARP_WRAPPER=NO ^
            -DENABLE_VPX=OFF ^
            -DENABLE_DOC=OFF ^
            -DLINPHONESDK_VERSION=5.3.4

      - name: Build
        working-directory: build-windows
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files\Git\usr\bin
          cmake --build . --config %BUILD_TYPE% --parallel %MAKEFILE_JOBS%

      - name: Install
        working-directory: build-windows
        shell: cmd
        run: cmake --build . --target install --config %BUILD_TYPE%

      - name: Build NSIS installer
        working-directory: build-windows
        shell: cmd
        run: cmake --build . --target package --config %BUILD_TYPE%
        continue-on-error: true

      - name: List output
        shell: cmd
        run: |
          dir build-windows\OUTPUT\ /s /b 2>nul || echo "OUTPUT not found"
          dir build-windows\*.exe 2>nul || echo "No installer found"

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Ubuntu 22.04 + Qt5)
    runs-on: ubuntu-22.04
    if: >-
      github.event.inputs.build_target == 'all' ||
      github.event.inputs.build_target == 'linux' ||
      github.event_name != 'workflow_dispatch'
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson git git-lfs pkg-config \
            python3 python3-pip doxygen yasm nasm perl \
            wget curl file \
            libssl-dev libxml2-dev libsqlite3-dev \
            libopus-dev libvpx-dev libbz2-dev \
            libx11-dev libxv-dev libxrandr-dev libxfixes-dev \
            libpulse-dev libasound2-dev libv4l-dev libudev-dev \
            libmbedtls-dev libsrtp2-dev \
            libgles2-mesa-dev \
            qtbase5-dev qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev qttools5-dev qttools5-dev-tools \
            libqt5svg5-dev \
            qml-module-qtquick-controls2 qml-module-qtquick-dialogs \
            qml-module-qt-labs-platform \
            qt5-image-formats-plugins
          python3 -m pip install pystache six

      - name: Init submodules (skip ispell)
        run: |
          git submodule update --init external/qtkeychain
          rm -rf linphone-sdk
          git clone --depth 1 https://github.com/Eclipse94w/linphone-sdk-mirror.git linphone-sdk

      - name: Configure CMake
        run: |
          mkdir -p build-linux && cd build-linux
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLINPHONESDK_PLATFORM=Desktop \
            -DENABLE_APP_PACKAGING=OFF \
            -DENABLE_UNIT_TESTS=OFF \
            -DENABLE_G729=OFF \
            -DENABLE_PQCRYPTO=OFF \
            -DENABLE_GPL_THIRD_PARTIES=ON \
            -DENABLE_CSHARP_WRAPPER=NO \
            -DENABLE_LDAP=OFF \
            -DENABLE_V4L=ON \
            -DENABLE_GLX=OFF \
            -DENABLE_GL=OFF \
            -DENABLE_QT_GL=OFF \
            -DENABLE_APP_SPELLING=OFF \
            -DLINPHONESDK_VERSION=5.3.4

      - name: Build
        working-directory: build-linux
        run: cmake --build . --target install --parallel ${{ env.MAKEFILE_JOBS }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunyso-desktop-linux-${{ github.sha }}
          path: build-linux/OUTPUT/**
          retention-days: 30
