#################################################
# Lunyso Desktop — Windows build pipeline
# Based on linphone-desktop 5.3.4 + Lunyso branding
#################################################

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  MAKEFILE_JOBS: 4
  QT_VERSION: "5.15.2"
  QT_ARCH: "win64_msvc2019_64"
  CI_BUILD_TYPE: "RelWithDebInfo"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - package

#################################################
# Windows build job (GitLab SaaS runner)
#################################################
build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 5h
  variables:
    CMAKE_GENERATOR: "Ninja"
    LINPHONESDK_PLATFORM: "Desktop"
    QT_ROOT: "C:/Qt/${QT_VERSION}/msvc2019_64"

  before_script:
    # Ensure tooling: Python, CMake, Ninja, NSIS, 7zip, Git LFS
    - choco install -y --no-progress python cmake ninja nsis 7zip git-lfs
    - refreshenv
    - python -m pip install --upgrade pip
    - python -m pip install aqtinstall

    # Install Qt 5.15.2 (desktop + qtwebengine + qtwebview modules)
    - aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -O C:/Qt -m qtwebengine qtwebview qtmultimedia

    # VS 2019/2022 dev env
    - |
      $vsPath = (& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
      Write-Output "VS Path: $vsPath"
      Import-Module (Join-Path $vsPath "Common7/Tools/Microsoft.VisualStudio.DevShell.dll")
      Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

    - $env:Path = "$env:QT_ROOT/bin;" + $env:Path
    - cmake --version
    - qmake --version

  script:
    - if (Test-Path build-desktop) { Remove-Item -Recurse -Force build-desktop }
    - mkdir build-desktop
    - cd build-desktop

    - |
      cmake .. -G "Ninja" `
        -DCMAKE_BUILD_TYPE=$env:CI_BUILD_TYPE `
        -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
        -DLINPHONESDK_PLATFORM=Desktop `
        -DENABLE_APP_PACKAGING=ON `
        -DENABLE_UNIT_TESTS=OFF `
        -DENABLE_G729=OFF `
        -DENABLE_PQCRYPTO=OFF `
        -DENABLE_GPL_THIRD_PARTIES=ON `
        -DENABLE_CSHARP_WRAPPER=NO
      if ($LastExitCode -ne 0) { throw "cmake configure failed" }

    - cmake --build . --config $env:CI_BUILD_TYPE --parallel $env:MAKEFILE_JOBS
    - if ($LastExitCode -ne 0) { throw "build failed" }

    - cmake --build . --target install --config $env:CI_BUILD_TYPE
    - if ($LastExitCode -ne 0) { throw "install failed" }

  artifacts:
    name: "lunyso-desktop-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-desktop/OUTPUT/**
      - build-desktop/linphone-app/*.exe
    when: always
    expire_in: 2 weeks

#################################################
# Package (NSIS installer)
#################################################
package-windows:
  stage: package
  tags:
    - saas-windows-medium-amd64
  needs:
    - build-windows
  script:
    - cd build-desktop
    - cmake --build . --target package --config $env:CI_BUILD_TYPE
  artifacts:
    name: "lunyso-installer-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-desktop/*.exe
    expire_in: 2 months
  allow_failure: true
