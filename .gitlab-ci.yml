# ─────────────────────────────────────────────────────────────────
# LUNYSO Desktop — CI/CD
# Builds a Windows installer (.exe) on every push to main or tag.
# Artifact is downloadable directly from GitLab for 90 days.
# ─────────────────────────────────────────────────────────────────

stages:
  - build

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none          # SDK handled manually (rate-limit safe)
  QT_VERSION: "6.7.3"
  QT_ARCH: "win64_msvc2019_64"
  QT_MODULES: "qtnetworkauth qtquick3d qtwebsockets qtmultimedia"

# ── Windows installer ──────────────────────────────────────────
windows-installer:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

  cache:
    key: "sdk-$CI_COMMIT_REF_SLUG"
    paths:
      - external/linphone-sdk/
    policy: pull-push

  before_script:
    # C++ workload (vcvars64.bat, cl.exe, link.exe — not pre-installed on GitLab runners)
    - choco install -y visualstudio2022-workload-vctools --no-progress --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
    # Chocolatey packages (cmake, ninja, nasm, nsis, python already on GitLab Windows image)
    - choco install -y cmake --installargs "ADD_CMAKE_TO_PATH=System" --version 3.28.4 | Out-Null
    - choco install -y nsis nasm ninja python --no-progress | Out-Null
    - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"; Update-SessionEnvironment

    # Python helpers required by linphone SDK cmake
    - pip install --quiet pystache six aqtinstall

    # Qt 6 via aqtinstall
    - aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --modules $env:QT_MODULES.Split(' ') --outputdir C:\Qt
    - $env:Qt6_DIR  = "C:\Qt\$env:QT_VERSION\msvc2019_64\lib\cmake\Qt6"
    - $env:PATH     = "C:\Qt\$env:QT_VERSION\msvc2019_64\bin;" + $env:PATH

    # Find Visual Studio vcvars64.bat (edition varies per runner image)
    - |
        $vcvarsLocations = @(
          'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat',
          'C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat',
          'C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat',
          'C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat',
          'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat',
          'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat',
          'C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvars64.bat'
        )
        $vcvars = $vcvarsLocations | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-Not $vcvars) {
          Write-Output "=== vcvars64.bat not found. Listing VS installations for diagnostics: ==="
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Depth 2 -ErrorAction SilentlyContinue
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio' -Recurse -Depth 2 -ErrorAction SilentlyContinue
          throw "vcvars64.bat not found — install VS Build Tools with C++ workload"
        }
        Write-Output "=== Found vcvars64.bat at: $vcvars ==="
        cmd.exe /c "call `"$vcvars`" && set" |
          ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:\$($matches[1])" $matches[2] } }

  script:
    # ── 1. SDK submodules (use cache if present, else fresh clone) ──
    - |
      if (-Not (Test-Path "external/linphone-sdk/.git")) {
        Write-Output "=== Cloning linphone-sdk ==="
        Remove-Item -Recurse -Force external/linphone-sdk -ErrorAction SilentlyContinue
        git clone --depth 1 https://gitlab.linphone.org/BC/public/linphone-sdk.git external/linphone-sdk
      }
      Write-Output "=== Fetching tags for git describe ==="
      git -C external/linphone-sdk fetch --tags
      Write-Output "=== Updating SDK submodules (sequential to avoid rate-limit) ==="
      $attempts = 0
      do {
        $attempts++
        Write-Output "Attempt $attempts..."
        git -C external/linphone-sdk submodule update --init --recursive --jobs 1
      } while ($LASTEXITCODE -ne 0 -and $attempts -lt 8)
      if ($LASTEXITCODE -ne 0) { throw "SDK submodule init failed after $attempts attempts" }

    # ── 2. Configure ──────────────────────────────────────────────
    - |
      cmake -B build -G Ninja `
        -DCMAKE_BUILD_TYPE=RelWithDebInfo `
        -DQt6_DIR="$env:Qt6_DIR" `
        -DENABLE_APP_PACKAGING=YES `
        -DENABLE_PQCRYPTO=ON `
        -DENABLE_GPL_THIRD_PARTIES=OFF

    # ── 3. Build ──────────────────────────────────────────────────
    - cmake --build build --parallel

    # ── 4. Install (populates share/ with grammar files etc.) ──────
    - cmake --install build

    # ── 5. Bundle Qt DLLs next to the .exe ────────────────────────
    - windeployqt build/OUTPUT/bin/lunyso.exe --qmldir Linphone/view --release

    # ── 6. Package → NSIS .exe installer ─────────────────────────
    - cd build && cpack -G NSIS -C RelWithDebInfo
    - cd ..

  artifacts:
    name: "LUNYSO-Windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/OUTPUT/Packages/LUNYSO-*.exe
    expire_in: 90 days
    when: on_success
