#################################################
# Lunyso Desktop — Build pipelines
# Based on linphone-desktop 5.3.4 + Lunyso branding
#################################################

variables:
  GIT_SUBMODULE_DEPTH: 1
  MAKEFILE_JOBS: 4
  QT_VERSION: "5.15.2"
  QT_ARCH: "win64_msvc2019_64"
  CI_BUILD_TYPE: "RelWithDebInfo"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - package

#################################################
# Windows build (GitLab SaaS runner)
#################################################
build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 5h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CMAKE_GENERATOR: "Ninja"
    LINPHONESDK_PLATFORM: "Desktop"
    QT_ROOT: "C:/Qt/${QT_VERSION}/msvc2019_64"

  before_script:
    - choco install -y --no-progress python cmake ninja nsis 7zip git-lfs
    - refreshenv
    - python -m pip install --upgrade pip
    - python -m pip install aqtinstall

    - aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -O C:/Qt -m qtwebengine qtwebview qtmultimedia

    - |
      $vsPath = (& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
      Write-Output "VS Path: $vsPath"
      Import-Module (Join-Path $vsPath "Common7/Tools/Microsoft.VisualStudio.DevShell.dll")
      Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

    - $env:Path = "$env:QT_ROOT/bin;" + $env:Path
    - cmake --version
    - qmake --version

  script:
    - if (Test-Path build-desktop) { Remove-Item -Recurse -Force build-desktop }
    - mkdir build-desktop
    - cd build-desktop

    - |
      cmake .. -G "Ninja" `
        -DCMAKE_BUILD_TYPE=$env:CI_BUILD_TYPE `
        -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
        -DLINPHONESDK_PLATFORM=Desktop `
        -DENABLE_APP_PACKAGING=ON `
        -DENABLE_UNIT_TESTS=OFF `
        -DENABLE_G729=OFF `
        -DENABLE_PQCRYPTO=OFF `
        -DENABLE_GPL_THIRD_PARTIES=ON `
        -DENABLE_CSHARP_WRAPPER=NO
      if ($LastExitCode -ne 0) { throw "cmake configure failed" }

    - cmake --build . --config $env:CI_BUILD_TYPE --parallel $env:MAKEFILE_JOBS
    - if ($LastExitCode -ne 0) { throw "build failed" }

    - cmake --build . --target install --config $env:CI_BUILD_TYPE
    - if ($LastExitCode -ne 0) { throw "install failed" }

  artifacts:
    name: "lunyso-desktop-win-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-desktop/OUTPUT/**
      - build-desktop/linphone-app/*.exe
    when: always
    expire_in: 2 weeks

#################################################
# Windows package (NSIS installer)
#################################################
package-windows:
  stage: package
  tags:
    - saas-windows-medium-amd64
  needs:
    - build-windows
  script:
    - cd build-desktop
    - cmake --build . --target package --config $env:CI_BUILD_TYPE
  artifacts:
    name: "lunyso-installer-win-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-desktop/*.exe
    expire_in: 2 months
  allow_failure: true

#################################################
# Linux build + AppImage (GitLab SaaS Linux runner)
# Produces an AppImage that runs on Arch / Ubuntu / Fedora
#################################################
build-linux:
  stage: build
  image: ubuntu:22.04
  tags:
    - saas-linux-medium-amd64
  timeout: 5h
  variables:
    DEBIAN_FRONTEND: "noninteractive"
    TZ: "Europe/Paris"
    CMAKE_GENERATOR: "Ninja"
    # Disable automatic recursive submodule clone — we do it manually below
    # to skip external/ispell (GitHub blocks anonymous clones from shared runners)
    GIT_SUBMODULE_STRATEGY: "none"

  before_script:
    - git submodule update --init --depth 1 external/qtkeychain
    - git submodule update --init --depth 1 linphone-sdk
    - git -C linphone-sdk submodule update --init --recursive --depth 1
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential cmake ninja-build git git-lfs pkg-config
        python3 python3-pip doxygen yasm nasm
        ca-certificates wget curl file fuse libfuse2 desktop-file-utils
        libssl-dev libxml2-dev libsqlite3-dev libsoup2.4-dev
        libopus-dev libvpx-dev libbz2-dev
        libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
        libx11-dev libxv-dev libxrandr-dev libxfixes-dev
        libpulse-dev libasound2-dev libv4l-dev libudev-dev
        libmbedtls-dev libsrtp2-dev
        qtbase5-dev qtdeclarative5-dev qtquickcontrols2-5-dev
        qtmultimedia5-dev qttools5-dev qttools5-dev-tools
        qtwebengine5-dev qtwebengine5-dev-tools
        libqt5svg5-dev libqt5webview5-dev
        qml-module-qtquick-controls2 qml-module-qtquick-dialogs
        qml-module-qt-labs-platform qml-module-qtwebengine
        qt5-image-formats-plugins
    - cmake --version
    - qmake --version

  script:
    - mkdir -p build-linux && cd build-linux
    - |
      cmake .. -G "Ninja" \
        -DCMAKE_BUILD_TYPE="$CI_BUILD_TYPE" \
        -DLINPHONESDK_PLATFORM=Desktop \
        -DENABLE_APP_PACKAGING=ON \
        -DENABLE_UNIT_TESTS=OFF \
        -DENABLE_G729=OFF \
        -DENABLE_PQCRYPTO=OFF \
        -DENABLE_GPL_THIRD_PARTIES=ON \
        -DENABLE_CSHARP_WRAPPER=NO
    - cmake --build . --target install --config "$CI_BUILD_TYPE" --parallel $MAKEFILE_JOBS

  artifacts:
    name: "lunyso-desktop-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-linux/OUTPUT/**
    when: always
    expire_in: 2 weeks

#################################################
# Linux package (AppImage)
#################################################
package-linux:
  stage: package
  image: ubuntu:22.04
  tags:
    - saas-linux-medium-amd64
  needs:
    - build-linux
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        cmake ninja-build file desktop-file-utils fuse libfuse2
        ca-certificates wget curl
        qtbase5-dev qttools5-dev qttools5-dev-tools
        qtwebengine5-dev qtmultimedia5-dev
    # linuxdeployqt (used by create_appimage.sh)
    - wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O /usr/local/bin/linuxdeployqt
    - chmod +x /usr/local/bin/linuxdeployqt
  script:
    - cd build-linux
    - cmake --build . --target package --config "$CI_BUILD_TYPE"
  artifacts:
    name: "lunyso-AppImage-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-linux/OUTPUT/Packages/*.AppImage
      - build-linux/*.AppImage
    expire_in: 2 months
  allow_failure: true
